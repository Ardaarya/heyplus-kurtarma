<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sync</title><style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #111; color: #eee; padding: 16px; }
  button { background: #0ff; color: #000; border: none; padding: 14px; 
           font-size: 16px; font-weight: bold; border-radius: 6px; width: 100%; }
  #log { background: #000; padding: 12px; margin-top: 12px; font-size: 11px; 
         line-height: 1.4; max-height: 65vh; overflow-y: auto; white-space: pre-wrap; 
         word-break: break-all; color: #aaa; border: 1px solid #222; }
  .ok { color: #0f6; } .err { color: #f34; } .info { color: #0ff; }
</style></head><body>
<button id="go" onclick="run()">CONNECT & SYNC</button><div id="log"></div>
<script>
let key = null, chRes = null;
const MAC = [0x7B, 0x4C, 0x03, 0xBB, 0x80, 0x98], PID = 911;
const S_MI = '0000fe95-0000-1000-8000-00805f9b34fb';
const C_TOK = '00000001-0000-1000-8000-00805f9b34fb';
const C_EVT = '00000010-0000-1000-8000-00805f9b34fb';
const S_RY = '0000b167-0000-1000-8000-00805f9b34fb';
const C_OPN = '0000aa01-0000-1000-8000-00805f9b34fb';

const box = document.getElementById('log');
function log(m, c = '') {
  const s = document.createElement('span'); s.className = c;
  s.textContent = m + '\n'; box.appendChild(s); box.scrollTop = box.scrollHeight;
}
function concat(...arrs) {
  const t = arrs.reduce((s, a) => s + a.length, 0), r = new Uint8Array(t);
  let o = 0; for (const a of arrs) { r.set(a, o); o += a.length; } return r;
}
function rc4(k, d) {
  const S = new Uint8Array(256); for (let i=0; i<256; i++) S[i] = i;
  let j = 0; for (let i=0; i<256; i++) { j = (j + S[i] + k[i % k.length]) & 0xFF; [S[i], S[j]] = [S[j], S[i]]; }
  let i2 = 0; j = 0; const o = new Uint8Array(d.length);
  for (let k2=0; k2<d.length; k2++) { i2 = (i2 + 1) & 0xFF; j = (j + S[i2]) & 0xFF; [S[i2], S[j]] = [S[j], S[i2]]; o[k2] = d[k2] ^ S[(S[i2] + S[j]) & 0xFF]; }
  return o;
}
function encV(v) {
  const p = []; if (v < 0) {
    let lo = v >>> 0, hi = 0xFFFFFFFF >>> 0;
    for (let i=0; i<10; i++) { p.push((lo & 0x7F) | (lo > 0x7F || hi > 0 ? 0x80 : 0)); lo = ((lo >>> 7) | (hi << 25)) >>> 0; hi = hi >>> 7; }
    return new Uint8Array(p);
  }
  while (v > 0x7F) { p.push((v & 0x7F) | 0x80); v >>>= 7; } p.push(v & 0x7F); return new Uint8Array(p);
}
function encFV(f, v) { return concat(encV((f << 3) | 0), encV(v)); }
function encFB(f, d) { return concat(concat(encV((f << 3) | 2), encV(d.length)), new Uint8Array(d)); }
function crc16(d) {
  let c = 0xFFFF; for (let i=0; i<d.length; i++) { c ^= (d[i] & 0xFF) << 8; for (let j=0; j<8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; }
  return new Uint8Array([c & 0xFF, (c >> 8) & 0xFF]);
}
async function send(ch, d) {
  const s = Math.floor(Math.random() * 65535) + 100, c = new Uint8Array(8);
  c[4] = s & 0xFF; c[5] = (s >> 8) & 0xFF; await ch.writeValueWithResponse(c);
  await new Promise(r => setTimeout(r, 60));
  const df = new Uint8Array(2 + d.length); df[1] = 1; df.set(d, 2); await ch.writeValueWithResponse(df);
}
function rbp(cmd, p = null) {
  const s = Math.floor(Math.random() * 127) + 1;
  let r = encFV(1, 1); if (p) r = concat(r, encFB(3, p));
  return concat(encFV(1, 1), encFV(2, cmd), encFV(3, s), encFB(4, r));
}
async function run() {
  document.getElementById('go').disabled = true; box.innerHTML = '';
  try {
    log("Scanning...", "info");
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'HeyPlus' }], optionalServices: [S_MI, S_RY] });
    const srv = await dev.gatt.connect();
    const mS = await srv.getPrimaryService(S_MI), rS = await srv.getPrimaryService(S_RY);
    const tC = await mS.getCharacteristic(C_TOK), eC = await mS.getCharacteristic(C_EVT), oC = await rS.getCharacteristic(C_OPN);
    
    key = concat(new Uint8Array(MAC), new Uint8Array([PID & 0xFF, (PID >> 8) & 0xFF]));
    await tC.startNotifications();
    tC.addEventListener('characteristicvaluechanged', e => { const v = new Uint8Array(e.target.value.buffer); if (chRes && v.length >= 4) chRes(v); });
    
    await eC.writeValueWithResponse(new Uint8Array([0x91, 0xca, 0x85, 0xde]));
    await tC.writeValueWithResponse(new Uint8Array([0xfa, 0xbb, 0x5c, 0x75, 0x70, 0xad, 0x31, 0x5e, 0xe4, 0x61, 0x83, 0x45]));
    await new Promise(r => setTimeout(r, 400));
    await tC.writeValueWithResponse(new Uint8Array([0x12, 0xba, 0x9d, 0x2a]));

    const chP = new Promise(res => { chRes = res; });
    await eC.writeValueWithResponse(new Uint8Array([0x01, 0xbc, 0x43, 0xcd]));
    const ch = await chP; log("Authenticated!", "ok");
    await tC.writeValueWithResponse(rc4(key, ch)); await new Promise(r => setTimeout(r, 400));

    const p5 = new Uint8Array([0x08, 0x01, 0x10, 0x05, 0x18, 0x56, 0x22, 0x02, 0x08, 0x01]);
    await send(oC, concat(p5, crc16(p5))); await new Promise(r => setTimeout(r, 500));
    const p30 = new Uint8Array([0x08, 0x01, 0x10, 0x1e, 0x18, 0x20, 0x22, 0x02, 0x08, 0x01]);
    await send(oC, concat(p30, crc16(p30))); await new Promise(r => setTimeout(r, 500));

    const conf = rbp(19, encFV(1, 1)); await send(oC, rc4(key, concat(conf, crc16(conf)))); await new Promise(r => setTimeout(r, 500));

    const n = new Date(), sec = Math.floor(n.getTime() / 1000), off = -n.getTimezoneOffset() * 60;
    const tF = concat(encFV(1, sec), encFV(2, off), encFV(3, n.getMilliseconds()), encFV(4, 0));
    const rtc = rbp(17, tF); await send(oC, rc4(key, concat(rtc, crc16(rtc))));
    log("SUCCESS: Synced!", "ok");
  } catch (err) { log("Error: " + err, "err"); }
  finally { document.getElementById('go').disabled = false; }
}
</script></body></html>
