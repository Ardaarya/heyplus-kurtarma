<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeyPlus W2100 Bind</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; padding: 16px; }
  h1 { color: #0ff; font-size: 18px; margin-bottom: 12px; }
  button { background: #0ff; color: #000; border: none; padding: 12px 24px; font-size: 16px;
           font-family: monospace; font-weight: bold; border-radius: 4px; cursor: pointer;
           width: 100%; margin: 8px 0; }
  button:disabled { background: #333; color: #666; cursor: not-allowed; }
  #btnCopy { background: #444; color: #e0e0e0; font-size: 13px; }
  #btnCopy.copied { background: #0a3; color: #fff; }
  #log { background: #0d0d1a; border: 1px solid #333; border-radius: 4px; padding: 12px;
         margin-top: 12px; font-size: 12px; line-height: 1.6; max-height: 70vh;
         overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  .ok { color: #0f0; }
  .err { color: #f44; }
  .info { color: #0ff; }
  .warn { color: #fa0; }

</style>
</head>
<body>
<h1>HeyPlus W2100 - Serverless Bind</h1>
<button id="btnBind" onclick="startBind()">CONNECT & BIND</button>
<button id="btnCopy" onclick="copyLog()">COPY LOG</button>
<div id="log"></div>

<script>
// === Global System State Variables ===
let sessionKey = null;
let txCounter = 0;

// === Copy log ===
function copyLog() {
  const text = document.getElementById('log').innerText;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('btnCopy');
    btn.textContent = 'COPIED!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'COPY LOG'; btn.classList.remove('copied'); }, 2000);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = document.getElementById('log').innerText;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const btn = document.getElementById('btnCopy');
    btn.textContent = 'COPIED!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'COPY LOG'; btn.classList.remove('copied'); }, 2000);
  });
}

// === Config ===
const DEVICE_MAC_CRYPTO = [0x7B, 0x4C, 0x03, 0xBB, 0x80, 0x98];
const DEVICE_PID = 911;

// UUIDs
const SERVICE_MI = '0000fe95-0000-1000-8000-00805f9b34fb';
const CHAR_MI_TOKEN = '00000001-0000-1000-8000-00805f9b34fb';
const CHAR_MI_EVENT = '00000010-0000-1000-8000-00805f9b34fb';
const SERVICE_RYEEX = '0000b167-0000-1000-8000-00805f9b34fb';
const CHAR_RYEEX_RC4 = '0000aa00-0000-1000-8000-00805f9b34fb';
const CHAR_RYEEX_OPEN = '0000aa01-0000-1000-8000-00805f9b34fb';

// === Logging ===
const logEl = document.getElementById('log');
function log(msg, cls = '') {
  const span = document.createElement('span');
  span.className = cls;
  span.textContent = msg + '\n';
  logEl.appendChild(span);
  logEl.scrollTop = logEl.scrollHeight;
}

// === Crypto Utilities ===
function int32ToLE(val) {
  const buf = new ArrayBuffer(4);
  new DataView(buf).setInt32(0, val, true);
  return new Uint8Array(buf);
}

function hexStr(arr) {
  return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
}

function mixA(mac, pid) {
  const p = [pid & 0xFF, (pid >> 8) & 0xFF];
  return new Uint8Array([mac[0], mac[2], mac[5], p[0], p[0], mac[4], mac[5], mac[1]]);
}

function rc4(key, data) {
  const S = new Uint8Array(256);
  for (let i = 0; i < 256; i++) S[i] = i;
  let j = 0;
  for (let i = 0; i < 256; i++) {
    j = (j + S[i] + key[i % key.length]) & 0xFF;
    [S[i], S[j]] = [S[j], S[i]];
  }
  let ii = 0; j = 0;
  const out = new Uint8Array(data.length);
  for (let k = 0; k < data.length; k++) {
    ii = (ii + 1) & 0xFF;
    j = (j + S[ii]) & 0xFF;
    [S[ii], S[j]] = [S[j], S[ii]];
    out[k] = data[k] ^ S[(S[ii] + S[j]) & 0xFF];
  }
  return out;
}

// === Protobuf Encoding System ===
function encodeVarint(value) {
  if (value < 0) {
    const parts = [];
    let lo = value >>> 0;
    let hi = ((value < 0 ? 0xFFFFFFFF : 0) >>> 0);
    for (let i = 0; i < 10; i++) {
      parts.push((lo & 0x7F) | (lo > 0x7F || hi > 0 ? 0x80 : 0));
      lo = ((lo >>> 7) | (hi << 25)) >>> 0;
      hi = hi >>> 7;
      if (lo === 0 && hi === 0) break;
    }
    return new Uint8Array(parts);
  }
  const parts = [];
  while (value > 0x7F) {
    parts.push((value & 0x7F) | 0x80);
    value >>>= 7;
  }
  parts.push(value & 0x7F);
  return new Uint8Array(parts);
}

function encodeFieldVarint(fieldNum, value) {
  const tag = encodeVarint((fieldNum << 3) | 0);
  const val = encodeVarint(value);
  return concat(tag, val);
}

function encodeFieldBytes(fieldNum, data) {
  const tag = encodeVarint((fieldNum << 3) | 2);
  const len = encodeVarint(data.length);
  return concat(concat(tag, len), data);
}

function concat(...arrs) {
  const total = arrs.reduce((s, a) => s + a.length, 0);
  const result = new Uint8Array(total);
  let offset = 0;
  for (const a of arrs) { result.set(a, offset); offset += a.length; }
  return result;
}

function crc16ccitt(data) {
  let crc = 0xFFFF;
  for (let i = 0; i < data.length; i++) {
    crc ^= (data[i] & 0xFF) << 8;
    for (let j = 0; j < 8; j++) {
      if (crc & 0x8000) crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
      else crc = (crc << 1) & 0xFFFF;
    }
  }
  return new Uint8Array([crc & 0xFF, (crc >> 8) & 0xFF]);
}

// === r_xfer Transport Layer Mechanics ===
function buildCmdFrame(pkgCount, transferSession) {
  const buf = new Uint8Array(8);
  buf[4] = pkgCount & 0xFF;
  buf[5] = (pkgCount >> 8) & 0xFF;
  buf[6] = transferSession & 0xFF;
  buf[7] = (transferSession >> 8) & 0xFF;
  return buf;
}

function buildDataFrame(sn, payload) {
  const buf = new Uint8Array(2 + payload.length);
  buf[0] = sn & 0xFF;
  buf[1] = (sn >> 8) & 0xFF;
  buf.set(payload, 2);
  return buf;
}

async function xferSend(char, data) {
  const transferSession = Math.floor(Math.random() * 65535) + 100;
  const cmdFrame = buildCmdFrame(1, transferSession);
  
  log('    CMD: ' + hexStr(cmdFrame), 'info');
  await char.writeValueWithResponse(cmdFrame);
  await new Promise(r => setTimeout(r, 60));

  const dataFrame = buildDataFrame(1, data);
  log('    DATA[sn=1]: ' + hexStr(dataFrame) + ' (' + dataFrame.length + 'B)');
  await char.writeValueWithResponse(dataFrame);
}

function buildRbpRequest(cmd, payload = null) {
  const sessionId = Math.floor(Math.random() * 127) + 1;
  let req = encodeFieldVarint(1, 1); 
  if (payload) req = concat(req, encodeFieldBytes(3, payload)); 

  let msg = encodeFieldVarint(1, 1);           
  msg = concat(msg, encodeFieldVarint(2, cmd)); 
  msg = concat(msg, encodeFieldVarint(3, sessionId)); 
  msg = concat(msg, encodeFieldBytes(4, req));  
  return msg;
}

// === PHASE 4: Core Web-Bluetooth Time Update Engine ===
async function syncWatchTime(openChar) {
  log("\n=== [NEW CODE APPLIED] PHASE 4: Time Synchronization ===", "phase");
  
  const now = new Date();
  const timestampSeconds = Math.floor(now.getTime() / 1000);
  
  // Rectify local platform offset math variables
  const tzOffsetSeconds = -now.getTimezoneOffset() * 60; 

  log(`[System Target] Local Browser Time: ${now.toString()}`);
  log(`[Payload Generation] Unix Stamp: ${timestampSeconds} | TZ Offset: ${tzOffsetOffsetSeconds}s`, "info");

  // Construct complete dynamic structural array expected by HeyPlus firmware
  const field1 = encodeFieldVarint(1, timestampSeconds);
  const field2 = encodeFieldVarint(2, tzOffsetSeconds);
  const field3 = encodeFieldVarint(3, now.getMilliseconds());
  const field4 = encodeFieldVarint(4, now.getTimezoneOffset() !== new Date(now.getFullYear(), 0, 1).getTimezoneOffset() ? 1 : 0);
  
  const timeFields = concat(field1, field2, field3, field4);

  // Wrap inside Command ID 17 envelope and compile validation signature
  const rbpPacket = buildRbpRequest(17, timeFields);
  const crcBytes = crc16ccitt(rbpPacket);
  const rawPacketWithCrc = concat(rbpPacket, crcBytes);

  log(`  Assembled Byte Payload (+CRC): ${hexStr(rawPacketWithCrc)}`, "info");

  // Encrypt raw payload framework using the active Phase 2 session tracking key
  const encryptedPayload = rc4(sessionKey, rawPacketWithCrc);

  log("  Dispatched encrypted time frame across r_xfer to characteristic AA01...");
  await xferSend(openChar, encryptedPayload);
  
  log("== [NEW CODE APPLIED] SUCCESS: Time packet successfully written to characteristic AA01 ==", "ok");
}

// === Central Connection Pipeline Entry ===
async function startBind() {
  document.getElementById('btnBind').disabled = true;
  logEl.innerHTML = '';
  
  try {
    log("Requesting HeyPlus W2100 BLE Device...", "info");
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'HeyPlus W2100' }, { services: [SERVICE_RYEEX] }],
      optionalServices: [SERVICE_MI, SERVICE_RYEEX]
    });

    log("Connecting to GATT server...", "info");
    const server = await device.gatt.connect();

    log("Discovering Ryeex custom pipeline services...", "info");
    const ryeexService = await server.getPrimaryService(SERVICE_RYEEX);
    const rc4Char = await ryeexService.getCharacteristic(CHAR_RYEEX_RC4);
    const openChar = await ryeexService.getCharacteristic(CHAR_RYEEX_OPEN);

    log("Generating local cryptographic key signature arrays...", "info");
    sessionKey = mixA(DEVICE_MAC_CRYPTO, DEVICE_PID);
    log("Crypto session initialized.", "ok");

    log("\n=== PHASE 3: Bind Simulation (r_xfer) ===", "phase");
    
    // 1. GetDevStatus (cmd=5)
    log("  GetDevStatus (cmd=5) -> AA01", "info");
    const devStatusPayload = new Uint8Array([0x08, 0x01, 0x10, 0x05, 0x18, 0x56, 0x22, 0x02, 0x08, 0x01]);
    const devStatusCrc = crc16ccitt(devStatusPayload);
    await xferSend(openChar, concat(devStatusPayload, devStatusCrc));
    await new Promise(r => setTimeout(r, 600));
