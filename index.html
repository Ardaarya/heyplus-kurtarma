let sessionKey = null;
let challengeResolver = null;
const DEVICE_MAC_CRYPTO = [0x7B, 0x4C, 0x03, 0xBB, 0x80, 0x98];
const DEVICE_PID = 911;

const SERVICE_MI = '0000fe95-0000-1000-8000-00805f9b34fb';
const CHAR_MI_TOKEN = '00000001-0000-1000-8000-00805f9b34fb';
const CHAR_MI_EVENT = '00000010-0000-1000-8000-00805f9b34fb';
const SERVICE_RYEEX = '0000b167-0000-1000-8000-00805f9b34fb';
const CHAR_RYEEX_RC4 = '0000aa00-0000-1000-8000-00805f9b34fb';
const CHAR_RYEEX_OPEN = '0000aa01-0000-1000-8000-00805f9b34fb';

const logEl = document.getElementById('log');
function log(msg, cls = '') {
  const span = document.createElement('span');
  span.className = cls; span.textContent = msg + '\n';
  logEl.appendChild(span); logEl.scrollTop = logEl.scrollHeight;
}
function hexStr(arr) {
  return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
}
function mixA(mac, pid) {
  const p = [pid & 0xFF, (pid >> 8) & 0xFF];
  return new Uint8Array([mac[0], mac[2], mac[5], p[0], p[0], mac[4], mac[5], mac[1]]);
}
function rc4(key, data) {
  const S = new Uint8Array(256); for (let i = 0; i < 256; i++) S[i] = i;
  let j = 0; for (let i = 0; i < 256; i++) {
    j = (j + S[i] + key[i % key.length]) & 0xFF; [S[i], S[j]] = [S[j], S[i]];
  }
  let ii = 0; j = 0; const out = new Uint8Array(data.length);
  for (let k = 0; k < data.length; k++) {
    ii = (ii + 1) & 0xFF; j = (j + S[ii]) & 0xFF; [S[ii], S[j]] = [S[j], S[ii]];
    out[k] = data[k] ^ S[(S[ii] + S[j]) & 0xFF];
  }
  return out;
}
function encodeVarint(val) {
  const parts = [];
  if (val < 0) {
    let lo = val >>> 0, hi = 0xFFFFFFFF >>> 0;
    for (let i = 0; i < 10; i++) {
      parts.push((lo & 0x7F) | (lo > 0x7F || hi > 0 ? 0x80 : 0));
      lo = ((lo >>> 7) | (hi << 25)) >>> 0; hi = hi >>> 7;
    }
    return new Uint8Array(parts);

  while (val > 0x7F) { parts.push((val & 0x7F) | 0x80); val >>>= 7; }

function encodeFieldVarint(fNum, val) {
  return concat(encodeVarint((fNum << 3) | 0), encodeVarint(val));
}
function encodeFieldBytes(fNum, data) {
  return concat(concat(encodeVarint((fNum << 3) | 2), encodeVarint(data.length)), new Uint8Array(data));
}
function concat(...arrs) {
  const total = arrs.reduce((s, a) => s + a.length, 0);
  const res = new Uint8Array(total); let off = 0;
  for (const a of arrs) { res.set(a, off); off += a.length; } return res;
}
function crc16ccitt(data) {

      if (crc & 0x8000) crc = ((crc << 1) ^ 0x1021) & 0xFFFF; else crc = (crc << 1) & 0xFFFF;
    }
  }
  return new Uint8Array([crc & 0xFF, (crc >> 8) & 0xFF]);

function buildCmdFrame(pCount, sId) {
  const buf = new Uint8Array(8);
  buf[4] = pCount & 0xFF; buf[5] = (pCount >> 8) & 0xFF;
  buf[6] = sId & 0xFF; buf[7] = (sId >> 8) & 0xFF; return buf;
}
function buildDataFrame(sn, payload) {
  const buf = new Uint8Array(2 + payload.length);
  buf[0] = sn & 0xFF; buf[1] = (sn >> 8) & 0xFF; buf.set(payload, 2); return buf;
}
async function xferSend(char, data) {
  const sess = Math.floor(Math.random() * 65535) + 100;
  const cmd = buildCmdFrame(1, sess); await char.writeValueWithResponse(cmd);
  await new Promise(r => setTimeout(r, 60));
  const df = buildDataFrame(1, data); await char.writeValueWithResponse(df);
}
function buildRbpRequest(cmd, payload = null) {
  const sId = Math.floor(Math.random() * 127) + 1;
  let req = encodeFieldVarint(1, 1); if (payload) req = concat(req, encodeFieldBytes(3, payload));
  let msg = encodeFieldVarint(1, 1); msg = concat(msg, encodeFieldVarint(2, cmd));
  msg = concat(msg, encodeFieldVarint(3, sId)); msg = concat(msg, encodeFieldBytes(4, req));
  return msg;

function handleMiNotification(e) {

  if (challengeResolver && v.length >= 4) challengeResolver(v);
}
async function startBind() {

    const dev = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: 'HeyPlus' }], optionalServices: [SERVICE_MI, SERVICE_RYEEX]

    const srv = await dev.gatt.connect();
    const miSrv = await srv.getPrimaryService(SERVICE_MI);

    await new Promise(r => setTimeout(r, 500));
    await tCh.writeValueWithResponse(new Uint8Array([0x12, 0xba, 0x9d, 0x2a]));

    const answer = rc4(sessionKey, rawChallenge);

    await new Promise(r => setTimeout(r, 500));

    log("\n=== PHASE 3: Base Verification ===", "phase");
    const p5 = new Uint8Array([0x08, 0x01, 0x10, 0x05, 0x18, 0x56, 0x22, 0x02, 0x08, 0x01]);
    await xferSend(oCh, concat(p5, crc16ccitt(p5))); await new Promise(r => setTimeout(r, 600));
    const p30 = new Uint8Array([0x08, 0x01, 0x10, 0x1e, 0x18, 0x20, 0x22, 0x02, 0x08, 0x01]);

    const rtc = buildRbpRequest(17, tFields);
    await xferSend(oCh, rc4(sessionKey, concat(rtc, crc16ccitt(rtc))));

    log("\n== SUCCESS: Watch Unlocked & Time Synced! ==", "ok");
  } catch (err) { log("Error: " + err, "err"); }
  finally { document.getElementById('btnBind').disabled = false; }
}
