<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeyPlus Bind</title><style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; padding: 16px; }
  h1 { color: #0ff; font-size: 18px; margin-bottom: 12px; }
  button { background: #0ff; color: #000; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; }
  #log { background: #0d0d1a; border: 1px solid #333; border-radius: 4px; padding: 12px; margin-top: 12px; font-size: 12px; line-height: 1.6; max-height: 70vh; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  .ok { color: #0f0; } .info { color: #0ff; } .phase { color: #f0f; font-weight: bold; }
</style></head><body>
<h1>HeyPlus W2100 - Serverless Bind</h1>
<button id="btnBind" onclick="startBind()">CONNECT & BIND</button><div id="log"></div>
<script>
const DEVICE_MAC_CRYPTO = [0x7B, 0x4C, 0x03, 0xBB, 0x80, 0x98], DEVICE_PID = 911;
let sessionKey = null; const logEl = document.getElementById('log');
function log(msg, cls = '') { const span = document.createElement('span'); span.className = cls; span.textContent = msg + '\n'; logEl.appendChild(span); logEl.scrollTop = logEl.scrollHeight; }
function hexStr(arr) { return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join(''); }
function mixA(mac, pid) { const p = [pid & 0xFF, (pid >> 8) & 0xFF]; return new Uint8Array([mac, mac, mac, p, p, mac, mac, mac]); }
function rc4(key, data) {
  const S = new Uint8Array(256); for (let i = 0; i < 256; i++) S[i] = i;
  let j = 0; for (let i = 0; i < 256; i++) { j = (j + S[i] + key[i % key.length]) & 0xFF; [S[i], S[j]] = [S[j], S[i]]; }
  let ii = 0; j = 0; const out = new Uint8Array(data.length);
  for (let k = 0; k < data.length; k++) { ii = (ii + 1) & 0xFF; j = (j + S[ii]) & 0xFF; [S[ii], S[j]] = [S[j], S[ii]]; out[k] = data[k] ^ S[(S[ii] + S[j]) & 0xFF]; } return out;
}
function encodeVarint(value) {
  if (value < 0) {
    const parts = []; let lo = value >>> 0, hi = 0xFFFFFFFF >>> 0;
    for (let i = 0; i < 10; i++) { parts.push((lo & 0x7F) | (lo > 0x7F || hi > 0 ? 0x80 : 0)); lo = ((lo >>> 7) | (hi << 25)) >>> 0; hi = hi >>> 7; } return new Uint8Array(parts);
  }
  const parts = []; while (value > 0x7F) { parts.push((value & 0x7F) | 0x80); value >>>= 7; } parts.push(value & 0x7F); return new Uint8Array(parts);
}
function encodeFieldVarint(fieldNum, value) { return concat(encodeVarint((fieldNum << 3) | 0), encodeVarint(value)); }
function encodeFieldBytes(fieldNum, data) { return concat(concat(encodeVarint((fieldNum << 3) | 2), encodeVarint(data.length)), data); }
function concat(...arrs) { const total = arrs.reduce((s, a) => s + a.length, 0), result = new Uint8Array(total); let offset = 0; for (const a of arrs) { result.set(a, offset); offset += a.length; } return result; }
function crc16ccitt(data) {
  let crc = 0xFFFF; for (let i = 0; i < data.length; i++) { crc ^= (data[i] & 0xFF) << 8; for (let j = 0; j < 8; j++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF; } return new Uint8Array([crc & 0xFF, (crc >> 8) & 0xFF]);
}
function buildCmdFrame(pkgCount, transferSession) { const buf = new Uint8Array(8); buf[4] = pkgCount & 0xFF; buf[5] = (pkgCount >> 8) & 0xFF; buf[6] = transferSession & 0xFF; buf[7] = (transferSession >> 8) & 0xFF; return buf; }
function buildDataFrame(sn, payload) { const buf = new Uint8Array(2 + payload.length); buf[0] = sn & 0xFF; buf[1] = (sn >> 8) & 0xFF; buf.set(payload, 2); return buf; }
async function xferSend(char, data) {
  const transferSession = Math.floor(Math.random() * 65535) + 100, cmdFrame = buildCmdFrame(1, transferSession); await char.writeValueWithResponse(cmdFrame); await new Promise(r => setTimeout(r, 60));
  const dataFrame = buildDataFrame(1, data); await char.writeValueWithResponse(dataFrame);
}
function buildRbpRequest(cmd, payload = null) {
  const sessionId = Math.floor(Math.random() * 127) + 1; let req = encodeFieldVarint(1, 1); if (payload) req = concat(req, encodeFieldBytes(3, payload));
  return concat(encodeFieldVarint(1, 1), encodeFieldVarint(2, cmd), encodeFieldVarint(3, sessionId), concat(encodeVarint((4 << 3) | 2), encodeVarint(req.length), req));
}
async function syncWatchTime(openChar, rc4Key) {
  log("\n=== PHASE 4: Time Synchronization ===", "phase");
  const now = new Date(), timestampSeconds = Math.floor(now.getTime() / 1000), tzOffsetSeconds = -now.getTimezoneOffset() * 60;
  const tPayload = concat(encodeFieldVarint(1, timestampSeconds), encodeFieldVarint(2, tzOffsetSeconds), encodeFieldVarint(3, now.getMilliseconds()), encodeFieldVarint(4, 0));
  const rtcPacket = buildRbpRequest(17, tPayload);
  await xferSend(openChar, rc4(rc4Key, concat(rtcPacket, crc16ccitt(rtcPacket)))); log("SUCCESS: Clock synchronization command transmitted!", "ok");
}
async function startBind() {
  document.getElementById('btnBind').disabled = true; logEl.innerHTML = '';
  try {
    log("Scanning for HeyPlus W2100 BLE Device...", "info");
    const device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'HeyPlus' }, { services: [0xFE95] }], optionalServices: ['0000fe95-0000-1000-8000-00805f9b34fb', '0000b167-0000-1000-8000-00805f9b34fb'] });
    const server = await device.gatt.connect(), ryeexService = await server.getPrimaryService('0000b167-0000-1000-8000-00805f9b34fb');
    const openChar = await ryeexService.getCharacteristic('0000aa01-0000-1000-8000-00805f9b34fb');
    sessionKey = mixA(DEVICE_MAC_CRYPTO, DEVICE_PID);

    log("\n=== PHASE 3: Bind (r_xfer + CRC) ===", "phase");
    const devStatusPayload = new Uint8Array([0x08, 0x01, 0x10, 0x05, 0x18, 0x56, 0x22, 0x02, 0x08, 0x01]); await xferSend(openChar, concat(devStatusPayload, crc16ccitt(devStatusPayload))); await new Promise(r => setTimeout(r, 600));
    const bindAckPayload = new Uint8Array([0x08, 0x01, 0x10, 0x1e, 0x18, 0x20, 0x22, 0x02, 0x08, 0x01]); await xferSend(openChar, concat(bindAckPayload, crc16ccitt(bindAckPayload))); await new Promise(r => setTimeout(r, 600));
    log("Watch RESPONDED! Pairing state verified.", "ok");

    await syncWatchTime(openChar, sessionKey); await new Promise(r => setTimeout(r, 2000)); log("\nExecution completed cleanly.", "ok");
  } catch (error) { log("BLE Error: " + error, "err"); } finally { document.getElementById('btnBind').disabled = false; }
}
</script></body></html>
